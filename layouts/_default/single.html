{{ define "main" }}
  {{- $anchor := "" -}}
  {{- if .Params.moves }}{{ $anchor = printf "#%s" (anchorize (partial "opening-group.html" .)) }}{{ end -}}
  <main class="content page-template page-{{ .Slug }}">
    <article class="post page">
      <header class="post-header">
        <a id="back-to-main-page" href="{{ site.Home.RelPermalink }}{{ $anchor }}"><i class="fa fa-chevron-left" aria-hidden="true"></i> All games</a>
      </header>
      <h1 class="post-title">{{ .Title }}</h1>
      <section class="post-content">
        {{ .Content }}
      </section>
    </article>
  </main>
{{ end }}
