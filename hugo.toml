baseURL = "https://datwins.github.io/carlsen_the_goat/"

disableKinds = ["section", "taxonomy", "term", "RSS", "robotsTXT"]

defaultContentLanguage = "en"

theme = "hugo-scroll"

title = "Carlsen the GOAT – Guess the Move"

enableGitInfo = true
enableEmoji = true

[params]
    favicon = "images/favicon.png"
    images = ["images/cover-image.jpg"]
    title_guard = true
    title = "Follow Your Hero"
    description = "Try to guess the moves of his games. Good Luck."
    language_menu = false
    show_current_lang = false
    hidedesignbyline = false
    invertSectionColors = false
    image_options = "webp q90 lanczos photo"
    combine_page_and_site_title = false

    [params.footer]
    showContactIcons = true
    showFooterLinks = false

[languages]
  [languages.en]
    weight = 10
    languageName = "English"
    contentDir = "content/en"

[markup.goldmark.renderer]
  unsafe = true
